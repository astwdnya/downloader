name: Delete Folder

on:
  workflow_dispatch:
    inputs:
      folder_name:
        description: "Folder to delete from repo"
        required: true

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 1

      - name: Configure Git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Delete folder and push
        run: |
          FOLDER="${{ github.event.inputs.folder_name }}"
          if [ -d "$FOLDER" ]; then
            git rm -rf "$FOLDER"
            git commit -m "cleanup: remove $FOLDER [ci skip]"
            git push
            echo "Deleted: $FOLDER"
          else
            echo "Folder not found: $FOLDER (already deleted?)"
          fi
