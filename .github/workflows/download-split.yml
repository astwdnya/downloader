name: Download and Split

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "Direct URL of the file to download"
        required: true
      folder_name:
        description: "Target folder name in repo"
        required: true

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 1

      - name: Configure Git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download file
        run: |
          URL="${{ github.event.inputs.file_url }}"
          FOLDER="${{ github.event.inputs.folder_name }}"
          mkdir -p "$FOLDER/chunks"

          # Get headers once
          HEADERS=$(curl -sI -L "$URL")

          # Try Content-Disposition first
          CD=$(echo "$HEADERS" | grep -i 'content-disposition' | grep -oP 'filename="?\K[^";\r\n]+' | head -1 | tr -d '\r')

          if [ -n "$CD" ]; then
            FILENAME="$CD"
            echo "Filename from Content-Disposition: $FILENAME"
          else
            URLPATH="${URL%%\?*}"
            FILENAME=$(basename "$URLPATH")
            echo "Filename from URL: $FILENAME"
          fi

          # If no extension, detect from Content-Type
          if [[ "$FILENAME" != *.* ]]; then
            CT=$(echo "$HEADERS" | grep -i '^content-type:' | head -1 | tr -d '\r\n ')
            if echo "$CT" | grep -qi 'video/mp4'; then
              FILENAME="${FILENAME}.mp4"
            elif echo "$CT" | grep -qi 'video/webm'; then
              FILENAME="${FILENAME}.webm"
            elif echo "$CT" | grep -qi 'video/x-matroska'; then
              FILENAME="${FILENAME}.mkv"
            elif echo "$CT" | grep -qi 'image/jpeg'; then
              FILENAME="${FILENAME}.jpg"
            elif echo "$CT" | grep -qi 'image/png'; then
              FILENAME="${FILENAME}.png"
            elif echo "$CT" | grep -qi 'audio/mpeg'; then
              FILENAME="${FILENAME}.mp3"
            elif echo "$CT" | grep -qi 'application/zip'; then
              FILENAME="${FILENAME}.zip"
            else
              FILENAME="${FILENAME}.bin"
            fi
            echo "Filename with extension from Content-Type: $FILENAME"
          fi

          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          echo "FOLDER=$FOLDER"     >> $GITHUB_ENV

          echo "Downloading: $URL -> $FOLDER/$FILENAME"
          curl -L --retry 5 --retry-delay 3 --retry-all-errors \
               --connect-timeout 30 --max-time 3600 \
               -o "$FOLDER/$FILENAME" \
               "$URL"

          SIZE=$(stat -c%s "$FOLDER/$FILENAME")
          echo "Downloaded: $FILENAME  ($SIZE bytes)"
          echo "FILE_SIZE=$SIZE" >> $GITHUB_ENV

          # If .bin, detect real type from magic bytes using file command
          if [[ "$FILENAME" == *.bin ]]; then
            MAGIC=$(file --brief "$FOLDER/$FILENAME" | tr '[:upper:]' '[:lower:]')
            if echo "$MAGIC" | grep -q 'mp4\|mpeg\|iso media'; then
              NEW="${FILENAME%.bin}.mp4"
              mv "$FOLDER/$FILENAME" "$FOLDER/$NEW"
              FILENAME="$NEW"
              echo "FILENAME=$FILENAME" >> $GITHUB_ENV
              echo "Detected as MP4: $FILENAME"
            elif echo "$MAGIC" | grep -q 'matroska\|webm'; then
              NEW="${FILENAME%.bin}.mkv"
              mv "$FOLDER/$FILENAME" "$FOLDER/$NEW"
              FILENAME="$NEW"
              echo "FILENAME=$FILENAME" >> $GITHUB_ENV
              echo "Detected as MKV: $FILENAME"
            fi
          fi

      - name: Split into chunks and push each one
        run: |
          FOLDER="${{ github.event.inputs.folder_name }}"
          MAX=94371840

          SIZE=$(stat -c%s "$FOLDER/$FILENAME")
          echo "File: $FILENAME  Size: $SIZE bytes"

          if [ "$SIZE" -le "$MAX" ]; then
            echo "Small file, no split needed."
            cp "$FOLDER/$FILENAME" "$FOLDER/chunks/chunk_0001_${FILENAME}"
            rm "$FOLDER/$FILENAME"
            echo "$FILENAME" > "$FOLDER/chunks/filename.txt"

            git add "$FOLDER/"
            git commit -m "download: $FILENAME [$FOLDER] [ci skip]"
            git push

          else
            echo "Splitting into 90 MB chunks..."
            split -b "$MAX" -d -a 4 "$FOLDER/$FILENAME" "$FOLDER/chunks/chunk_"
            rm "$FOLDER/$FILENAME"

            TOTAL=$(ls "$FOLDER/chunks/" | wc -l)
            echo "Total chunks: $TOTAL"
            ls -lh "$FOLDER/chunks/"

            # Save real filename
            echo "$FILENAME" > "$FOLDER/chunks/filename.txt"

            # Push filename.txt first
            git add "$FOLDER/chunks/filename.txt"
            git commit -m "meta: filename [$FOLDER] [ci skip]"
            git push

            # Push each chunk one by one
            IDX=0
            for CHUNK in $(ls "$FOLDER/chunks/chunk_"* | sort); do
              IDX=$((IDX + 1))
              CNAME=$(basename "$CHUNK")
              CSIZE=$(stat -c%s "$CHUNK")
              echo "[$IDX/$TOTAL] Pushing $CNAME ($CSIZE bytes)..."

              git add "$CHUNK"
              git commit -m "chunk $IDX/$TOTAL: $CNAME [$FOLDER] [ci skip]"
              git push

              sleep 2
            done

            echo "All $IDX chunks pushed."
          fi
